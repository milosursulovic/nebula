services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nebula
      POSTGRES_PASSWORD: nebula
      POSTGRES_DB: nebula
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebula -d nebula"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      # Single-node dev cluster: the defaults (replication factor 3) can
      # never be satisfied with only one broker, which would otherwise
      # wedge internal topic creation (__consumer_offsets) forever.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  nebula-api:
    build:
      context: ../..
      dockerfile: deployments/docker/nebula-api.Dockerfile
    environment:
      NEBULA_HTTP_PORT: "8080"
      NEBULA_DATABASE_URL: "postgres://nebula:nebula@postgres:5432/nebula?sslmode=disable"
      NEBULA_JWT_SECRET: "dev-only-secret-change-me"
      NEBULA_WORKER_COUNT: "3"
      NEBULA_KAFKA_BROKERS: "kafka:9092"
      NEBULA_AGENT_PORT: "7071"
      NEBULA_NODE_BOOTSTRAP_SECRET: "dev-only-node-bootstrap-secret-change-me"
      NEBULA_AGENT_TLS_CA_FILE: "/etc/nebula/tls/nebula-agent.crt"
      NEBULA_OTLP_ENDPOINT: "http://jaeger:4318"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  nebula-agent:
    build:
      context: ../..
      dockerfile: deployments/docker/nebula-agent.Dockerfile
    environment:
      NEBULA_API_URL: "http://nebula-api:8080"
      NEBULA_AGENT_HOSTNAME: "nebula-agent-1"
      # The Docker network's own DNS name for this service — how
      # nebula-api reaches it back for VM operations (spec section 27/28).
      NEBULA_AGENT_IP: "nebula-agent"
      NEBULA_AGENT_PORT: "7071"
      NEBULA_AGENT_CPU: "8"
      NEBULA_AGENT_MEMORY_MB: "16384"
      NEBULA_AGENT_DISK_GB: "500"
      NEBULA_AGENT_HEARTBEAT_INTERVAL: "5s"
      NEBULA_NODE_BOOTSTRAP_SECRET: "dev-only-node-bootstrap-secret-change-me"
      NEBULA_AGENT_TLS_CERT_FILE: "/etc/nebula/tls/nebula-agent.crt"
      NEBULA_AGENT_TLS_KEY_FILE: "/etc/nebula/tls/nebula-agent.key"
      NEBULA_OTLP_ENDPOINT: "http://jaeger:4318"
    ports:
      - "7071:7071"
    depends_on:
      - nebula-api

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - nebula-api

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres-data:
